# ---- sink: iceberg via lakekeeper rest catalog ----
debezium.sink.type=iceberg
debezium.sink.iceberg.upsert=true
debezium.sink.iceberg.upsert-keep-deletes=true
debezium.sink.iceberg.write.format.default=parquet
debezium.sink.iceberg.type=rest
debezium.sink.iceberg.uri=http://lakekeeper:8181/catalog
debezium.sink.iceberg.warehouse=lakehouse
debezium.sink.iceberg.table-namespace=cdc
debezium.sink.iceberg.catalog-name=lakekeeper
debezium.sink.iceberg.io-impl=org.apache.iceberg.io.ResolvingFileIO
debezium.sink.iceberg.s3.endpoint=http://minio:9000
debezium.sink.iceberg.s3.path-style-access=true
debezium.sink.iceberg.s3.access-key-id=minio
debezium.sink.iceberg.s3.secret-access-key=minio12345
debezium.sink.iceberg.client.region=local-01

# ---- batching: accumulate events up to 30s/2048 items -> fewer commits, larger files ----
debezium.sink.batch.batch-size-wait=MaxBatchSizeWait
debezium.sink.batch.batch-size-wait.max-wait-ms=30000
debezium.sink.batch.batch-size-wait.wait-interval-ms=5000
debezium.source.max.batch.size=2048
debezium.source.max.queue.size=16384

# ---- source: postgres ----
# credentials are literal here (this file is mounted as-is, no templating):
# change them in sync with SOURCE_PG_USER/SOURCE_PG_PASSWORD in .env, otherwise
# postgres-source moves to the new credentials and CDC stops without an error
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres-source
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=postgres
debezium.source.topic.prefix=dbz
debezium.source.schema.include.list=inventory
debezium.source.table.include.list=inventory.customers,inventory.products,inventory.products_on_hand,inventory.orders
debezium.source.offset.flush.interval.ms=0

# ---- debezium state -> iceberg (we study this too) ----
debezium.source.offset.storage=io.debezium.server.iceberg.offset.IcebergOffsetBackingStore
debezium.source.offset.storage.iceberg.table-name=debezium_offsets

# ---- event format (schemas are required for table auto-creation) ----
debezium.format.value=connect
debezium.format.key=connect
debezium.format.value.schemas.enable=true
debezium.format.key.schemas.enable=true

# ---- flattening ----
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
# source.ts_ns is required: upsert dedup sorts by __source_ts_ns
debezium.transforms.unwrap.add.fields=op,table,source.ts_ms,source.ts_ns,db
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
debezium.transforms.unwrap.drop.tombstones=true

# ---- logging ----
quarkus.log.console.json=false
quarkus.log.category."org.apache.hadoop".level=WARN
quarkus.log.category."org.apache.iceberg".level=WARN
